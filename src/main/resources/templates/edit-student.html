<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Student</title>
</head>
<body>

    <h1>Edit Student</h1>

    <form th:action="@{/admin/students}"
           th:object="${studentDto}"
            method="post">

        <input type="hidden" name="id" th:value="${studentId}">

        <label for="name">Name:</label>
        <input type="text"
               id="name"
               th:field="*{name}">

        <div th:if="${#fields.hasErrors('name')}"
             th:errors="*{name}">
        </div>


        <br>

        <label for="surname">Surname:</label>
        <input type="text"
               id="surname"
               th:field="*{surname}">

        <div th:if="${#fields.hasErrors('surname')}"
             th:errors="*{surname}">
        </div>

        <br><br>

        <label for="email">Email:</label>
        <input type="email"
               id="email"
               th:field="*{email}">

        <div th:if="${#fields.hasErrors('email')}"
             th:errors="*{email}">
        </div>

        <br><br>

        <button type="submit">Save Changes</button>

    </form>

</body>
</html>
